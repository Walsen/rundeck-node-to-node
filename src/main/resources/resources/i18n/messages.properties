# Node File Copy Plugin - English messages

plugin.title=Node File Copy
plugin.description=Copy files or directories from one node to another using SSH/SCP

property.sourceNode.title=Source Node
property.sourceNode.description=Hostname or IP address of the source node

property.sourcePath.title=Source Path
property.sourcePath.description=Path to the file or directory on the source node

property.destinationNode.title=Destination Node
property.destinationNode.description=Hostname or IP address of the destination node

property.destinationPath.title=Destination Path
property.destinationPath.description=Path where the file/directory should be copied on the destination node

property.sshUser.title=SSH User
property.sshUser.description=SSH username for authentication (used for both nodes if not specified separately)

property.sourceUser.title=Source SSH User
property.sourceUser.description=SSH username for source node (overrides SSH User if set)

property.destinationUser.title=Destination SSH User
property.destinationUser.description=SSH username for destination node (overrides SSH User if set)

property.sshKeyPath.title=SSH Key Path
property.sshKeyPath.description=Path to SSH private key file on Rundeck server

property.sshKeyPassphrase.title=SSH Key Passphrase
property.sshKeyPassphrase.description=Passphrase for SSH private key (if encrypted)

property.sshPort.title=SSH Port
property.sshPort.description=SSH port number (default: 22)

property.recursive.title=Recursive Copy
property.recursive.description=Enable recursive copy for directories

property.preserveAttributes.title=Preserve Attributes
property.preserveAttributes.description=Preserve file modification times and permissions

property.transferMode.title=Transfer Mode
property.transferMode.description=Method for transferring files: 'direct' (source to destination) or 'via-rundeck' (through Rundeck server)

property.tempDirectory.title=Temp Directory
property.tempDirectory.description=Temporary directory on Rundeck server for 'via-rundeck' mode

property.connectionTimeout.title=Connection Timeout
property.connectionTimeout.description=SSH connection timeout in seconds
